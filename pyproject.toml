[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "certa-dso"
version = "0.1.0"
description = "Reference implementation of CERTA-DSO"
requires-python = ">=3.10"
dependencies = ["cryptography>=42", "numpy>=1.26"]

[project.optional-dependencies]
hf = ["torch>=2.2", "transformers>=4.44", "datasets>=2.20", "peft>=0.12", "accelerate>=0.33"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
